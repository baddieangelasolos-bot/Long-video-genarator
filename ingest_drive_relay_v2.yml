name: ingest-drive
# Copies files from Google Drive into a GitHub Release, byte-for-byte (no re-encoding).
# Trigger by hand (Actions tab) OR remotely via the REST API (workflow_dispatch or repository_dispatch 'ingest-media').
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create
        default: v1.0.0
        required: false
      files_json:
        description: 'Optional JSON [[name, driveFileId, bytes], ...]. Empty = built-in 5 files'
        default: ''
        required: false
      purge_all:
        description: 'true = delete ALL existing releases/tags/assets before publishing (clean slate)'
        default: 'true'
        required: false
  repository_dispatch:
    types: [ingest-media]
permissions:
  contents: write
concurrency:
  group: ingest-drive
  cancel-in-progress: false
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TAG: ${{ inputs.tag || github.event.client_payload.tag || 'v1.0.0' }}
      PURGE_ALL: ${{ inputs.purge_all || github.event.client_payload.purge_all || 'true' }}
      RELAY_FILES_JSON: ${{ inputs.files_json || (github.event.client_payload.files && toJSON(github.event.client_payload.files)) || '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate inputs
        run: |
          [[ "$TAG" =~ ^[A-Za-z0-9._-]{1,64}$ ]] || { echo "bad tag"; exit 1; }
          [[ "$PURGE_ALL" == "true" || "$PURGE_ALL" == "false" ]] || { echo "purge_all must be true/false"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install gdown
        run: pip install gdown
      - name: Download from Drive, verify size, write manifest
        run: |
          cat > relay_fetch.py <<'PY'
          import json, os, re, sys, time, hashlib
          import gdown
          DEFAULT = [
              ["gal.mp4",   "1h5Q1aHNXMWDBo_qR-Kmp5OpTZqtHBrwF", 125795124],
              ["dor.mp4",   "11WovlOWIZbhjTZBwbIPFd3U5SWG3Uvid", 273754662],
              ["rma.mp4",   "1zl87D_E0h5ogGCUINr_29ivNmZxr7Pp2", 344812952],
              ["music.m4a", "1XaLWyDqyGj-wTlgB04Sxv7j9oKTrF5hc", 2612210],
              ["ref.mp4",   "13D83SMPio2H9LWn4vWeI0ZBYJaXvWkbZ", 35303250],
          ]
          FILES = json.loads(os.environ["RELAY_FILES_JSON"]) if os.environ.get("RELAY_FILES_JSON") else DEFAULT
          for name, fid, size in FILES:
              if not re.fullmatch(r"[A-Za-z0-9._-]{1,80}", name) or not re.fullmatch(r"[A-Za-z0-9_-]{10,100}", fid or "x") and not os.environ.get("RELAY_ALLOW_ANY_ID") or int(size) <= 0:
                  sys.exit("bad entry: " + repr([name, fid, size]))
          def sha256(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for block in iter(lambda: f.read(1 << 20), b""):
                      h.update(block)
              return h.hexdigest()
          manifest = {"created": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()), "files": {}}
          failed = []
          for name, fid, size in FILES:
              ok = False
              for attempt in range(1, 6):
                  if os.path.exists(name):
                      os.remove(name)
                  try:
                      gdown.download(id=fid, output=name, quiet=True, resume=False)
                  except Exception as e:
                      print(name, "attempt", attempt, "error:", type(e).__name__, str(e)[:200], flush=True)
                  got = os.path.getsize(name) if os.path.exists(name) else 0
                  if got == size:
                      ok = True
                      break
                  print(name, "size", got, "expected", size, "attempt", attempt,
                        "(HTML quota/permission page? check sharing = Anyone with the link)", flush=True)
                  time.sleep(float(os.environ.get("RELAY_RETRY_SLEEP", "20")) * attempt)
              if not ok:
                  failed.append(name)
                  continue
              manifest["files"][name] = {"size": size, "sha256": sha256(name), "drive_id": fid}
              print("OK", name, size, manifest["files"][name]["sha256"][:16], flush=True)
          json.dump(manifest, open("manifest.json", "w"), indent=1)
          if failed:
              print("FAILED:", failed)
              sys.exit(1)
          PY
          python relay_fetch.py
      - name: Clean slate (only after a successful download, so a failed run never destroys the last good release)
        run: |
          set -euo pipefail
          if [ "$PURGE_ALL" = "true" ]; then
            for t in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName'); do
              echo "deleting release $t (assets + tag)"
              gh release delete "$t" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY"
            done
          else
            gh release delete "$TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || echo "no existing release $TAG"
          fi
      - name: Publish release with the untouched files
        run: |
          set -euo pipefail
          FILES=$(python -c "import json;print(' '.join(json.load(open('manifest.json'))['files']))")
          gh release create "$TAG" $FILES manifest.json \
            --repo "$GITHUB_REPOSITORY" --title "Source media $TAG" \
            --notes "Byte-exact copies from Google Drive. Verify with manifest.json (size + sha256)."
