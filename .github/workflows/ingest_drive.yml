name: ingest-drive
# FULL PIPELINE (Mode B). Same name/inputs as the old relay, so autonomy/trigger_ingest.py keeps working unchanged.
# Claude only fires the trigger; this runner downloads the media from Drive, builds the video, self-heals, exports and emails.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag used for the fallback copy of the output
        default: v1.0.0
        required: false
      files_json:
        description: 'Optional JSON [[name, driveFileId, bytes], ...]. Empty = built-in 5 files'
        default: ''
        required: false
      purge_all:
        description: 'true = delete ALL old releases/tags/assets first (clean slate)'
        default: 'true'
        required: false
  repository_dispatch:
    types: [ingest-media]
permissions:
  contents: read
concurrency:
  group: ingest-drive
  cancel-in-progress: false
jobs:
  build:
    if: github.actor == github.repository_owner
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TAG: ${{ inputs.tag || github.event.client_payload.tag || 'v1.0.0' }}
      PURGE_ALL: ${{ inputs.purge_all || github.event.client_payload.purge_all || 'true' }}
      RELAY_FILES_JSON: ${{ inputs.files_json || (github.event.client_payload.files && toJSON(github.event.client_payload.files)) || '' }}
      WORK_DIR: /home/claude/work
      SRC_DIR: /home/claude/work/src
      PIPE_DIR: ${{ github.workspace }}/pipeline
      PLAYER_NAME: ${{ vars.PLAYER_NAME || '' }}
      CLUB_NAME: ${{ vars.CLUB_NAME || '' }}
      USE_AI: ${{ vars.USE_AI || '1' }}
      RENDER_PRESET: medium
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate inputs
        run: |
          [[ "$TAG" =~ ^[A-Za-z0-9._-]{1,64}$ ]] || { echo "bad tag"; exit 1; }
          [[ "$PURGE_ALL" == "true" || "$PURGE_ALL" == "false" ]] || { echo "purge_all must be true/false"; exit 1; }
      - name: Clean slate (old releases, assets, tags)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$PURGE_ALL" = "true" ]; then
            for t in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName'); do
              echo "deleting release $t"
              gh release delete "$t" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY"
            done
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: System tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg patch fonts-dejavu-core
          ffmpeg -version | head -1
      - name: Python packages
        run: pip install -r requirements.txt
      - name: Poppins font
        run: |
          sudo mkdir -p /usr/share/fonts/truetype/google-fonts
          for w in Bold Regular; do
            sudo curl -fsSL -o /usr/share/fonts/truetype/google-fonts/Poppins-$w.ttf \
              "https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-$w.ttf" || echo "Poppins-$w download failed (pipeline falls back to DejaVu)"
          done
          sudo fc-cache -f || true
      - name: Work directory at the path the scripts expect
        run: |
          sudo mkdir -p /home/claude/work
          sudo chown -R "$USER" /home/claude
          mkdir -p /home/claude/work/src /home/claude/work/build
      - name: Run the supervised pipeline (Mechanic)
        id: pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          BUILTIN_FILES_JSON: ${{ secrets.BUILTIN_FILES_JSON }}
        run: python autonomy/run_pipeline.py
      - name: Step summary and exit status
        if: always()
        run: |
          {
            echo "### Highlight pipeline"
            echo "outcome: ${{ steps.pipeline.outcome }}"
            ls -la /home/claude/work/build/*.mp4 2>/dev/null || echo "no video produced"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Collect logs and proposals
        if: always()
        run: |
          mkdir -p /home/claude/out
          cp /home/claude/work/*.log /home/claude/out/ 2>/dev/null || true
          cp /home/claude/work/build/*.log /home/claude/out/ 2>/dev/null || true
          cp -r /home/claude/work/proposals /home/claude/out/ 2>/dev/null || true
          cp /home/claude/work/analysis/*.json /home/claude/out/ 2>/dev/null || true
      - name: Upload logs (private repo only)
        if: always() && github.event.repository.private
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pipeline-logs
          path: /home/claude/out
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload final video as artifact (private repo only)
        if: always() && github.event.repository.private
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: final-video
          path: /home/claude/work/build/*_Highlights.mp4
          retention-days: 7
          compression-level: 0
          if-no-files-found: ignore
      - name: Fallback release asset (only if the Drive export failed or is not configured)
        if: always() && steps.pipeline.outcome == 'success' && github.event.repository.private
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f /home/claude/work/build/export_failed ]; then
            V=$(ls /home/claude/work/build/*_Highlights.mp4 | head -1)
            gh release create "$TAG" "$V" --repo "$GITHUB_REPOSITORY" --title "Output $TAG" \
              --notes "Drive export failed or is not configured; video kept here as a fallback."
          fi
      - name: Email logs on any failure
        if: always()
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          PIPELINE_OUTCOME: ${{ steps.pipeline.outcome }}
        run: python3 autonomy/email_logs.py

          
