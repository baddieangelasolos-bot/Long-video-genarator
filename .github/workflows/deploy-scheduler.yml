# Lives at .github/workflows/deploy-scheduler.yml
# Never runs by itself: Actions tab > "deploy-scheduler" > Run workflow.
#
# Repo secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   (permissions: Workers Scripts Edit, Workers KV Storage Edit)
#   CLOUDFLARE_ACCOUNT_ID
#   PIPELINE_KEY           same value as the n8n "Pipeline Trigger Key" credential
#   ADMIN_TOKEN            long random string; same value goes in Vercel as WORKER_ADMIN_TOKEN
# Optional secrets: N8N_WEBHOOK_URL (overrides the default in wrangler.toml), N8N_API_KEY, N8N_METRICS_URL,
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
name: deploy-scheduler

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: edge/scheduler
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check required secrets
        run: |
          missing=""
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          [ -n "${{ secrets.PIPELINE_KEY }}" ] || missing="$missing PIPELINE_KEY"
          [ -n "${{ secrets.ADMIN_TOKEN }}" ] || missing="$missing ADMIN_TOKEN"
          if [ -n "$missing" ]; then
            echo "Missing repo secrets:$missing"
            exit 1
          fi
          echo "All required secrets are present."
      - name: Test the Worker
        run: |
          set -eo pipefail
          node test.mjs | tail -3
      - name: Find or create the KV namespace
        run: |
          set -eo pipefail
          TITLE="dead-bot-scheduler-STATE"
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          LIST=$(curl -sS --max-time 30 "${API}?per_page=100" -H "$AUTH")
          if [ "$(echo "$LIST" | jq -r '.success')" != "true" ]; then
            echo "Cloudflare KV list failed. Errors:"
            echo "$LIST" | jq -c '.errors'
            exit 1
          fi
          ID=$(echo "$LIST" | jq -r --arg t "$TITLE" '.result[] | select(.title==$t) | .id' | head -1)
          if [ -z "$ID" ]; then
            RES=$(curl -sS --max-time 30 -X POST "$API" -H "$AUTH" -H "Content-Type: application/json" --data "{\"title\":\"$TITLE\"}")
            if [ "$(echo "$RES" | jq -r '.success')" != "true" ]; then
              echo "Cloudflare KV create failed. Errors:"
              echo "$RES" | jq -c '.errors'
              exit 1
            fi
            ID=$(echo "$RES" | jq -r '.result.id')
            echo "Created KV namespace $TITLE"
          else
            echo "Found existing KV namespace $TITLE"
          fi
          [ -n "$ID" ] && [ "$ID" != "null" ] || { echo "KV namespace id not found"; exit 1; }
          sed -i "s/REPLACED_BY_DEPLOY_WORKFLOW/$ID/" wrangler.toml
          grep -q "$ID" wrangler.toml || { echo "Could not write the KV id into wrangler.toml"; exit 1; }
          echo "KV namespace id: $ID"
      - name: Deploy the Worker
        env:
          HOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
        run: |
          set -eo pipefail
          ARGS=""
          if [ -n "$HOOK_URL" ]; then ARGS="--var N8N_WEBHOOK_URL:$HOOK_URL"; fi
          npx --yes wrangler@4 deploy $ARGS 2>&1 | tee deploy.log
      - name: Set the Worker secrets
        env:
          PIPELINE_KEY: ${{ secrets.PIPELINE_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          N8N_METRICS_URL: ${{ secrets.N8N_METRICS_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -eo pipefail
          jq -n 'env | {PIPELINE_KEY, ADMIN_TOKEN, N8N_API_KEY, N8N_METRICS_URL, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID} | with_entries(select(.value != null and .value != ""))' > /tmp/secrets.json
          npx --yes wrangler@4 secret bulk /tmp/secrets.json
          rm -f /tmp/secrets.json
      - name: Check /__health
        run: |
          URL=$(grep -o 'https://[a-zA-Z0-9.-]*workers.dev' deploy.log | head -1 || true)
          echo "Worker URL: $URL"
          echo "Worker URL: $URL" >> "$GITHUB_STEP_SUMMARY"
          [ -n "$URL" ] || { echo "Worker URL not found in deploy.log"; exit 1; }
          sleep 5
          curl -sS --max-time 20 "$URL/__health" | tee -a "$GITHUB_STEP_SUMMARY"
